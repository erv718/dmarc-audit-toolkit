# dmarc-audit-toolkit settings. Copy this file to audit.toml (gitignored, because
# it names your domains) and edit. Secrets stay in .env; nothing here is secret.
# Every key is optional. A command-line flag beats this file, and this file
# beats the built-in default. Reading it needs Python 3.11 or newer.

[audit]
# Domains to audit beside the tenant's own, which are always audited when the app
# registration can read them (Domain.Read.All); with no registration, this is the list.
# Domains the tenant does not hold go in .env as EXTRA_DOMAINS (see .env.example).
domains = ["example.com", "example.net"]
# Also add every subdomain seen sending in the last 30 days (needs ThreatHunting.Read.All).
# Every audited domain's own mail flow (the last 30 days) is measured on each run either way.
mailflow = true
# Mail-log window in days (30 is the API maximum; the mail-flow count stays at 30) and the
# aggregate-report window.
days = 30
report_days = 30
# Senders you recognise: your vendors' IP prefixes and domains. The aggregate-report
# unknown-sender check runs only on the IP prefixes; domains alone only narrow its
# signing-domain list and inform the aggregate-report labels, and the per-IP check does not run.
known = ["vendor.example", "192.0.2.0/24"]
# Envelope domains of your sending platforms, domains only (IP prefixes go in known; one
# here matches nothing, and every run warns about it), for the heuristic labels in the
# mail log and in the aggregate reports. Like known's domains they narrow the
# signing-domain list, but they never switch the unknown-sender check on.
vendor_domains = ["vendor.example"]
# DKIM selectors to probe in addition to the common list.
selectors = ["s1", "mail"]
# The run's report address: the plan writes it into new DMARC records and appends it to an
# existing record's rua that lacks it. One address (a list is never appended). Without it,
# collect.py uses the report mailbox (RUA_MAILBOX).
rua_address = "mailto:dmarc-reports@example.com"
# Where runs are written, and how many dated runs to keep (older ones are deleted).
out = "audit-out"
keep = 12
# strict = true widens exit code 1 to: a gate that is not "go", a plan hold, or a
# tenant step that failed or was truncated. For schedulers that alert on exit codes.
strict = false

[notify]
# The summary is posted only when SLACK_WEBHOOK_URL is set in .env AND enabled is true.
enabled = true
# "teams" is designed in but not yet verified against a live webhook; keep "slack".
target = "slack"

# Formal exceptions (docs/methodology.md step 5). A failing sender listed here
# stops holding the gate until the date passes. All four fields are required;
# an entry missing one is reported and NOT applied. match is an IP, an IP
# prefix, an envelope or DKIM signing domain, or a From address. A From address
# also covers forged copies of it: for a vendor platform, match its envelope
# domain. A domain covers an aggregate-report stream only when every domain the
# stream authenticated with, other than the audited ones, is under it.
#
# [[exceptions]]
# match = "192.0.2.30"
# reason = "legacy statements printer, SPF-only by design; the business accepts the loss at reject"
# owner = "finance-systems"
# until = 2026-12-31
# removal_criterion = "printer replaced, or the vendor enables DKIM signing for example.com"

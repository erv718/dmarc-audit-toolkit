name: ci

on:
  push:
    branches: [master, "v*-build"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: python ${{ matrix.python-version }} on ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # all three requirement files: tests import mcp_server at module level,
        # and that module exits 2 at import time when the mcp SDK is missing
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-mcp.txt
      - name: Compile
        # compileall walks the directories itself: neither PowerShell nor python
        # expands a shell glob such as src/*.py, so py_compile would get the literal string
        run: python -m compileall -q src scripts
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Offline audit smoke test
        shell: bash
        run: |
          # audit.py exits 1 whenever a major or blocking finding exists, and the shipped
          # sample data is built to produce several, so 0 and 1 both mean a completed run.
          # 2 is a usage or input error; anything else, or a traceback, is a crash.
          set -eo pipefail
          mkdir -p audit-out-ci
          rc=0
          python src/audit.py example.com --offline \
            --rua samples/rua --maillog samples/sample_maillog.csv --headers samples/headers \
            --out audit-out-ci 2>&1 | tee audit-out-ci/run.log || rc=$?
          echo "audit.py exit code: $rc (0 = clean, 1 = major or blocking findings; both are a completed run)"
          if grep -q "Traceback (most recent call last)" audit-out-ci/run.log; then
            echo "::error::audit.py crashed with a traceback"
            exit 1
          fi
          case "$rc" in
            0|1) ;;
            *) echo "::error::audit.py exited $rc (2 = usage or input error)"; exit 1 ;;
          esac
          for f in report.md report.json; do
            if [ ! -s "audit-out-ci/$f" ]; then
              echo "::error::audit-out-ci/$f was not written"
              exit 1
            fi
          done
          python -c "import json; d = json.load(open('audit-out-ci/report.json', encoding='utf-8-sig')); print('report.json ok:', len(d.get('findings', [])), 'findings, gate', d.get('gate', {}).get('verdict'))"
      - name: Public-repo gate
        run: python scripts/check_public.py

  windows:
    name: python 3.12 on windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-mcp.txt
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Tests
        run: python -m pytest tests/ -q
      - name: PowerShell syntax
        shell: pwsh
        run: |
          # AST parse of every src/*.ps1: catches syntax errors without running anything
          $files = @(Get-ChildItem -Path src -Filter *.ps1 -File)
          if ($files.Count -eq 0) { Write-Output "::error::no src/*.ps1 found - nothing was checked"; exit 1 }
          $failed = 0
          foreach ($f in $files) {
            $tokens = $null
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs)
            if ($errs.Count -gt 0) {
              $failed++
              foreach ($e in $errs) {
                Write-Output ("::error file=src/{0},line={1}::{2}" -f $f.Name, $e.Extent.StartLineNumber, $e.Message)
              }
            } else {
              Write-Output ("{0}: ok" -f $f.Name)
            }
          }
          if ($failed -gt 0) { Write-Output "::error::$failed of $($files.Count) PowerShell script(s) have parse errors"; exit 1 }
          Write-Output "$($files.Count) PowerShell script(s) parsed cleanly"
